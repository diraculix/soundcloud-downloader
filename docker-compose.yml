version: "3.9"
services:
  scdl:
    build: .
    container_name: soundcloud-downloader
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: host
    privileged: true
    volumes:
      - /mnt/Media/music/soundcloud/lukas-wolter-779075141:/Music/SoundCloud/lukas-wolter-779075141
    logging:
      options:
        max-size: "10m"
        max-file: "3"
